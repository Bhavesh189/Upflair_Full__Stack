<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Shadow</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: rgb(220, 255, 255);
        }

        h1 {
            margin : 20vh auto;
            font-size: 8rem;
            text-align: center;
            font-family: poppins, sans-serif;
            letter-spacing: 12px;
        }

        .w {
            color : rgb(46, 46, 243);
            font-weight: 900;
            text-shadow: 15px 0px 0px rgb(223, 40, 223);
        }

        .s {
            color : yellow;
            font-weight: 900;
            text-shadow: 15px 0px 0px rgb(0, 255, 200);
        }
        .a {
            color : rgb(255, 85, 0);
            font-weight: 900;
            text-shadow: 15px 0px 0px orange;
        }
        .h {
            color : rgb(255, 85, 0);
            font-weight: 900;
            text-shadow: 15px 0px 0px orange;
        }
        .o {
            color : orange;
            font-weight: 900;
            text-shadow: 15px 0px 0px rgb(255, 85, 0);
        }
    </style>
</head>
<body>
    <h1>
        <span class="w">W</span><span class="a">A</span><span class="s">S</span><span class="h">H</span><span class="e"> </span><span class="s">Y</span><span class="o">O</span><span class="a">U</span><span class="s">R</span><span class="e"> </span><span class="a">H</span><span class="s">A</span><span class="w">N</span><span class="o">D</span><span class="w">S</span><span class="a">!</span>
    </h1>
</body>
</html>
