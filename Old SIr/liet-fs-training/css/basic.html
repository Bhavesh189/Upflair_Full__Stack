<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="basic.css">
    <style>
        /* 3 types of selectors*/
        /* id selector - unique selector 
        to select is use # before name */
        #a{
            color:blue;
            background-color:red;
        }
        /* class selector - is used to design multiple elements
        to select class use . before name */
        .x{
            color: yellow;
            background-color: blue;
            font-size: 30px;
        }
        /* element selector  */
        h1{
            color: green;
        }
    </style> 
</head>
<body>
    <p style="color:red;background-color: tan;">this is inline css example</p>
    <p id="a" >this is example of internal css </p>
    <p class="x">this is example of class selector</p>
    <h1>this is example of element selector </h1>
    <p class="b" >this is an example of external css </p>
</body>
</html>
