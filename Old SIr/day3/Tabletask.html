<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>t</title>

    <style>
        table {
            margin-top: 20vh;
            height: 60vh;
            width: 60vw;
            border: 2px solid black;
        }

        tr,
        td {
            border: 2px solid black;
        }


        .x {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        td {
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="x">
        <table>
            <tr>
                <td colspan="6">Time Table</td>
            </tr>

            <tr>
                <td rowspan="6">Hours</td>
                <td>Mon</td>
                <td>Tue</td>
                <td>Wed</td>
                <td>Thu</td>
                <td>Fri</td>
            </tr>

            <tr>
                <td>Science</td>
                <td>Maths</td>
                <td>Science</td>
                <td>Maths</td>
                <td>Art</td>
            </tr>

            <tr>
                <td>Social</td>
                <td>History </td>
                <td>English </td>
                <td>Social</td>
                <td>Esports </td>
            </tr>

            <tr>
                <td colspan="5">Lunch</td>
            </tr>

            <tr>
                <td>Social</td>
                <td>Maths</td>
                <td>Science</td>
                <td>Maths</td>
                <td rowspan="2">Projects</td>
            </tr>

            <tr>
                <td>Social</td>
                <td>History </td>
                <td>English </td>
                <td>Social</td>
            </tr>
        </table>
    </div>
</body>

</html>
