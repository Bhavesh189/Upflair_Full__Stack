<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .b {
            height: 200px;
            width: 200px;
        }

        .b1 {
            background-color: brown;
            position: absolute;
            top : 0;
            left: 0;
        }
        .b2 {
            background-color: green;
            position: absolute;
            top : 0;
            right: 0;
        }
        .b3 {
            background-color: blue;
            position: absolute;
            bottom: 0;
            left: 0;
        }

        .b4 {
            background-color: purple;
            position: absolute;
            right: 0;
            bottom: 0;
        }

        .b5 {
            background-color: grey;
            position: absolute;
            top : 45%;
            left : 45%;
        }

    </style>
</head>
<body>
    <div class="b b1"></div>
    <div class="b b2"></div>
    <div class="b b3"></div>
    <div class="b b4"></div>
    <div class="b b5"></div>
</body>
</html>
