<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .red, .blue {
            background-color: red;
            width: 40vw;
            height: 20vh;
        }

        .red {
            position : absolute;
            top : 0;
            left: 0;
        }

        .g1 {
            position: absolute;
            top: 0;
            left: 40vw;
        }

        .g2 {
            position: absolute;
            top : 300px;
            left: 0;
        }

        .y1 {
            position: absolute;
            top : 300px;
            left: 40vw;
        }

        .y2 {
            position: absolute;
            top : 600px;
            left: 0;
        }

        .blue {
            position: absolute;
            top : 600px;
            left : 40vw;
        }

        .green, .yellow {
            height: 300px;
            width: 300px;
            background-color: green;
        }

        .yellow {
            background-color: yellow;
        }

        .blue {
            background-color: blue;
        }
    </style>
</head>
<body>
    <div class="red"></div>
    <div class="green g1"></div>
    <div class="green g2"></div>
    <div class="yellow y1"></div>
    <div class="yellow y2"></div>
    <div class="blue"></div>
</body>
</html>
