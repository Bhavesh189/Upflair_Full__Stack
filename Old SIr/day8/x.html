<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .xx {
            /* border : 2px solid black; */
            height: 55vh;
            width: 35vw;
            background-color: white;
            margin: 10vh auto;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 80px;
            row-gap: 150px;
        }

        .z {
            /* background-color: black; */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* body {
            background-color: black;
        } */

        .b {
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 14px;
            height: 30vh;
            width: 30vh;
        }

        .b1 {
            box-shadow: inset 20px 1px 20px 20px rgba(0, 0, 0, 0.39);          
            rotate: 90deg;
        }

        .b1 p {
            rotate: 270deg;
        }

        .b2 {
            box-shadow: 2px 40px 100px 10px black;
        }

        .b3 {
            box-shadow: 10px 20px 30px black;
        }

        .b4 {
            box-shadow: 3px 20px 30px black;
        }
    </style>
</head>

<body>
    <div class="z">
        <div class="xx">
            <div class="b b1"><p>#25</p></div>
            <div class="b b2">#26</div>
            <div class="b b3">#29</div>
            <div class="b b4">#30</div>
        </div>
    </div>
</body>

</html>
