<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box {
            height: 80vh;
            width: 80vw;
            border: 2px solid red;
            overflow: hidden;
            background-color: black;
            display: flex;
            position: relative;
        }

        .box img {
            height: 190vh;
            /* transform: translateY(-18vh); */
            width: 50vw;
            rotate: 20deg;
            position: absolute;
            right: -5vw;
            top: -10vh;
            border-top-right-radius: 14px;
            border-bottom-left-radius: 14px;
        }
    </style>
</head>
<body>
    <div class="box">
        <img src="https://media.istockphoto.com/id/1127158685/photo/solitaire-diamond-engagement-ring-isolated-on-white-background.jpg?s=612x612&w=0&k=20&c=p4LQKgGvrYQc0p2JSRdpwKESoWlJ9DnmsefJdKHOJq4=" alt="Ring Image">
    </div>
</body>
</html>
