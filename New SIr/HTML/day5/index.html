    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: poppins, sans-serif;
    }
    h1 {
        text-align: center;
    }

    table {
        border-collapse: collapse;
    }

    th, tr, td {
        border: 2px solid black;
        padding: 20px;
    }

    div, span {
        border : 2px solid black;

    .oo {
        border : none;

    p {
        font-size: 30px;
        text-align: center;
        margin-top: 30px;

</style>

<body>
    <h1>Table Tag</h1>

    <table>
        <thead>
            <th>Name</th>

        </thead>

        <tbody>
            <tr>
                <td>XYZ</td>

            </tr>
            <tr>

            <tr>

            </tr>
        </tbody>
    </table>

    <div><h1>This is A Div Tag</h1></div>
    <div class="oo">
        <span>This is a span tag</span>
    </div>

    <h1>Character ENtity</h1>

    <p> &amp;gt; = &gt;</p>
    <p> &amp;lt; = &lt;</p>
    <p> &amp;#169; = &#169;</p>
