<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: rgb(10, 227, 155);
        }

        form {
            display: flex;
            flex-direction: column;
            border: 2px solid black;
            border-radius: 15px;
            background-color: aqua;
            box-shadow: 2px 2px 200px red, -2px -2px 200px red;
            width: 50vw;
            height: 85vh;
            margin: 10vh auto;
            padding : 20px;
        }

        input {
            border-radius: 15px;
            padding: 14px;
        }

        .btns {
            display: flex;
            margin: 10vh;
            width: 50vw;
            gap : 20vw;
        }

        button {
            padding: 20px;
            border-radius: 14px;
            transition: 0.3s ease-in-out;
            cursor: pointer;
        }

        button:hover {
            transform: scale(1.1);
        }

        .x {
            display: flex;
            flex-direction: column;
            gap : 20px;
        }

    </style>
</head>
<body>
    <form action="">
        <div class="x">
        <label for="name">Name :</label>
        <input type="text" name="name" id="name" placeholder="Enter Your Name">
        <label for="mail">Email :</label>
        <input type="email" name="email" id="mail" placeholder="Enter Your Mail">
        <label for="no">Mobile Number :</label>
        <input type="tel" name="no" id="no" placeholder="Enter Your Number">
        <label for="pass">Enter Your Password :</label>
        <input type="password" name="pass" id="pass" placeholder="Enter Your Password">
        </div>

        <div class="btns">
            <button type="submit">Submit</button>
            <button type="reset">Reset</button>
        </div>
    </form>
</body>
</html>
